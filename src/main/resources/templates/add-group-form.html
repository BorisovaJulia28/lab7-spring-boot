<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Форма учебной группы</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container py-4">
    <h1 class="mb-4"
        th:text="${group.id == null ? 'Добавить группу' : 'Изменить группу'}">
        Форма учебной группы
    </h1>

    <form th:action="@{/groups/save}"
          th:object="${group}" method="post"
          class="col-md-6">

        <input type="hidden" th:field="*{id}">

        <div class="mb-3">
            <label for="name" class="form-label">Название группы</label>
            <input id="name" type="text" th:field="*{name}"
                   class="form-control" maxlength="20"
                   placeholder="Например, РИЗ-250110у" required>
            <div class="text-danger" th:errors="*{name}"></div>
        </div>

        <div class="mb-3">
            <label for="faculty" class="form-label">Факультет</label>
            <input id="faculty" type="text" th:field="*{faculty}"
                   class="form-control" maxlength="20" required>
            <div class="text-danger" th:errors="*{faculty}"></div>
        </div>

        <div class="mb-3">
            <label for="course" class="form-label">Курс</label>
            <input id="course" type="number" th:field="*{course}"
                   class="form-control" min="1" step="1" required>
            <div class="text-danger" th:errors="*{course}"></div>
        </div>

        <button type="submit" class="btn btn-success">Сохранить</button>
        <a th:href="@{/groups}" class="btn btn-secondary">К списку</a>
    </form>
</div>
</body>
</html>
