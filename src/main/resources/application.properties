spring.application.name=lab7

server.address=127.0.0.1
server.port=8080

spring.datasource.url=jdbc:h2:file:./testdb/students;IFEXISTS=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

spring.thymeleaf.encoding=UTF-8

management.endpoints.web.exposure.include=health,info,metrics,mappings
management.endpoint.health.show-details=always
management.info.env.enabled=true

info.app.name=Lab7
info.app.description=Students and study groups
info.app.version=1.0